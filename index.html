<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Остров кристаллов</title>
<style>
:root{--glass:rgba(10,30,40,.5);--ink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--glass:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--glass:rgba(0,0,0,.55)}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd8e8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 12px);padding:8px 16px;border-radius:999px;background:var(--glass);color:var(--ink);font-weight:600;font-size:18px;pointer-events:none}
#msg{position:fixed;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:var(--glass);color:var(--ink);font-size:15px;text-align:center;max-width:80vw;pointer-events:none;opacity:0;transition:opacity .6s}
#toast{top:calc(env(safe-area-inset-top,0px) + 12px);font-weight:600}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);opacity:1}
#jump{position:fixed;right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:78px;height:78px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:var(--glass);color:#fff;font-size:15px;font-weight:600;touch-action:none}
#jump:active{background:rgba(255,255,255,.35)}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);display:none;pointer-events:none}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.8)}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">💎 0</div>
<div id="toast" class="msg" style="display:none"></div>
<div id="msg" class="msg"></div>
<div id="hint" class="msg"></div>
<div id="joy"><i></i></div>
<button id="jump">Прыжок</button>
<script src="three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x9fd8e8);S.fog=new THREE.Fog(0x9fd8e8,40,170);
const cam=new THREE.PerspectiveCamera(60,1,.1,400);
function fit(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));fit();
S.add(new THREE.HemisphereLight(0xffffff,0x6a9a6a,.8));
const sun=new THREE.DirectionalLight(0xfff2d6,.8);sun.position.set(50,80,30);S.add(sun);

const H=(x,z)=>Math.sin(x*.05)*2.2+Math.cos(z*.045)*2.2+Math.sin((x+z)*.11)*.9+Math.cos(x*.13-z*.09)*.6+3-Math.pow(Math.hypot(x,z)/90,3)*14;
const g=new THREE.PlaneGeometry(260,260,130,130);g.rotateX(-Math.PI/2);
const pp=g.attributes.position,col=new Float32Array(pp.count*3),cc=new THREE.Color();
for(let i=0;i<pp.count;i++){const h=H(pp.getX(i),pp.getZ(i));pp.setY(i,h);
 cc.set(h<-.6?0xe8d8a0:h>6.5?0xdfe3e6:h>4.5?0x7fae5a:0x5fbf5f);cc.offsetHSL(0,0,(Math.random()-.5)*.05);col.set([cc.r,cc.g,cc.b],i*3)}
g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
S.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})));
const wg=new THREE.PlaneGeometry(600,600);wg.rotateX(-Math.PI/2);
const water=new THREE.Mesh(wg,new THREE.MeshLambertMaterial({color:0x4fb8dc,transparent:true,opacity:.78}));water.position.y=-2;S.add(water);

const M=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true});
const mTr=M(0x8a5a3a),mL1=M(0x2f8f4f),mL2=M(0x3aa65a),mRk=M(0x9aa1a8);
const trG=new THREE.CylinderGeometry(.3,.4,2,6),lfG=new THREE.ConeGeometry(1.6,3,7),rkG=new THREE.DodecahedronGeometry(1);
const obs=[];
for(let i=0;i<300&&obs.length<110;i++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*62,x=Math.cos(a)*r,z=Math.sin(a)*r,h=H(x,z);
 if(h<0||Math.hypot(x,z)<6)continue;
 const t=new THREE.Group(),tr=new THREE.Mesh(trG,mTr),l1=new THREE.Mesh(lfG,mL1),l2=new THREE.Mesh(lfG,mL2);
 tr.position.y=1;l1.position.y=3.2;l2.position.y=4.6;l2.scale.setScalar(.7);t.add(tr,l1,l2);
 const s=.8+Math.random()*.7;t.scale.setScalar(s);t.position.set(x,h,z);S.add(t);obs.push({x,z,r:.7*s})}
for(let i=0;i<40;i++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*64,x=Math.cos(a)*r,z=Math.sin(a)*r,h=H(x,z);
 if(h<-.5||Math.hypot(x,z)<6)continue;
 const m=new THREE.Mesh(rkG,mRk),s=.6+Math.random()*1.1;m.scale.set(s,s*.7,s);m.position.set(x,h+s*.2,z);m.rotation.y=Math.random()*6;S.add(m);obs.push({x,z,r:s*.9})}
const mCl=new THREE.MeshLambertMaterial({color:0xffffff}),clG=new THREE.SphereGeometry(1,10,8);
for(let i=0;i<12;i++){const c=new THREE.Group();for(let j=0;j<3;j++){const b=new THREE.Mesh(clG,mCl);b.scale.set(5+Math.random()*4,2.5,3.5);b.position.set(j*5-5,Math.random()*1.5,Math.random()*2);c.add(b)}
 c.position.set((Math.random()-.5)*260,38+Math.random()*18,(Math.random()-.5)*260);S.add(c)}

const P=new THREE.Group(),body=new THREE.Group();P.add(body);
const bs=new THREE.Mesh(new THREE.SphereGeometry(.6,24,16),new THREE.MeshLambertMaterial({color:0xffb347}));bs.position.y=.6;body.add(bs);
for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.14,10,8),new THREE.MeshBasicMaterial({color:0xffffff}));e.position.set(s*.22,.8,.5);
 const q=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),new THREE.MeshBasicMaterial({color:0x222222}));q.position.set(s*.22,.8,.62);body.add(e,q)}
P.position.set(0,H(0,0),0);S.add(P);

const cols=[0xff6bd6,0x6be3ff,0xffe36b,0xa58bff,0x7dff9a],cry=[],cG=new THREE.OctahedronGeometry(.6);
function place(m){for(;;){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*60,x=Math.cos(a)*r,z=Math.sin(a)*r,h=H(x,z);
 if(h>-.3&&Math.hypot(x-P.position.x,z-P.position.z)>15){m.userData.b=h+1.3;m.position.set(x,h+1.3,z);return}}}
for(let i=0;i<30;i++){const c=cols[i%5],m=new THREE.Mesh(cG,new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:.6,flatShading:true}));
 m.scale.y=1.7;place(m);S.add(m);cry.push(m)}

let jump=0,jx=0,jy=0,yaw=0,pitch=.45,jid=null,lid=null,ox=0,oy=0,lx=0,ly=0;
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space')jump=1});addEventListener('keyup',e=>keys[e.code]=0);
const cv=$('c'),joy=$('joy'),knob=joy.firstElementChild;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);
 if(e.pointerType==='mouse'||e.clientX>innerWidth/2){if(lid===null){lid=e.pointerId;lx=e.clientX;ly=e.clientY}}
 else if(jid===null){jid=e.pointerId;ox=e.clientX;oy=e.clientY;joy.style.left=ox+'px';joy.style.top=oy+'px';joy.style.display='block'}});
cv.addEventListener('pointermove',e=>{
 if(e.pointerId===lid){yaw-=(e.clientX-lx)*.006;pitch=Math.min(1.2,Math.max(.1,pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY}
 else if(e.pointerId===jid){const vx=e.clientX-ox,vy=e.clientY-oy,l=Math.hypot(vx,vy),m=Math.min(l,50)/50;
  jx=l?vx/l*m:0;jy=l?-vy/l*m:0;knob.style.transform='translate('+jx*40+'px,'+(-jy*40)+'px)'}});
const up=e=>{if(e.pointerId===lid)lid=null;if(e.pointerId===jid){jid=null;jx=jy=0;joy.style.display='none';knob.style.transform=''}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
$('jump').addEventListener('pointerdown',e=>{jump=1;e.preventDefault()});

const hud=$('hud'),toast=$('toast'),hint=$('hint');
hint.textContent=matchMedia('(pointer:coarse)').matches?'Левый палец — идти, правый — крутить камеру. Соберите кристаллы!':'WASD — идти, мышь — камера, пробел — прыжок. Соберите кристаллы!';
setTimeout(()=>hint.style.opacity=0,7000);
let vy=0,score=0,pop=0,last=performance.now();
function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.05);last=now;const t=now/1000;
 let ix=jx+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),iy=jy+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);
 const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}
 const sy=Math.sin(yaw),cy=Math.cos(yaw),dx=cy*ix-sy*iy,dz=-sy*ix-cy*iy,mm=Math.min(m,1);
 if(mm>.05){let nx=P.position.x+dx*9*dt,nz=P.position.z+dz*9*dt;
  for(const o of obs){const d=Math.hypot(nx-o.x,nz-o.z),lim=o.r+.6;if(d<lim){nx=o.x+(nx-o.x)/d*lim;nz=o.z+(nz-o.z)/d*lim}}
  if(H(nx,nz)>-3){P.position.x=nx;P.position.z=nz}
  let d=Math.atan2(dx,dz)-P.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));P.rotation.y+=d*Math.min(1,dt*12)}
 const gy=Math.max(H(P.position.x,P.position.z),-2.2);
 if(jump&&P.position.y-gy<.25){vy=9}jump=0;
 vy-=24*dt;P.position.y+=vy*dt;if(P.position.y<=gy){P.position.y=gy;vy=0}
 const air=P.position.y-gy>.25;
 pop=Math.max(0,pop-dt*3);
 body.scale.set(1,(air?1.15:1+Math.sin(t*14)*.06*mm)+pop*.25,1);
 cry.forEach((c,i)=>{c.rotation.y=t*1.5+i;c.position.y=c.userData.b+Math.sin(t*2+i)*.25;
  if(Math.hypot(c.position.x-P.position.x,c.position.z-P.position.z)<1.7&&Math.abs(c.position.y-P.position.y-.8)<2.2){
   score++;pop=1;hud.textContent='💎 '+score;place(c);
   if(score%10===0){toast.style.display='block';toast.textContent='Уже '+score+' кристаллов!';toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,2000)}}});
 const cp=Math.cos(pitch),tx=P.position.x,ty=P.position.y+1.2,tz=P.position.z,cx=tx+Math.sin(yaw)*cp*10,cz=tz+Math.cos(yaw)*cp*10;
 cam.position.set(cx,Math.max(ty+Math.sin(pitch)*10,H(cx,cz)+1.2,-1),cz);cam.lookAt(tx,ty,tz);
 R.render(S,cam)}
requestAnimationFrame(tick);
</script></body></html>
